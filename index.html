function addEmoji(text,b,mode){

}
function humanize(text){
  text=text.replace(/\s+/g,' ').trim();
  if(maybe(.18)) text=text.replace(/\.$/,'');
  if(maybe(.22)) text=text.charAt(0).toLowerCase()+text.slice(1);
  return text;
}

const usedCache={};
function storageKey(person,type){return `pfw_used_${person}_${type}`}
function getUsed(person,type){
  const k=storageKey(person,type);
  if(!usedCache[k]){try{usedCache[k]=new Set(JSON.parse(localStorage.getItem(k)||'[]'))}catch(e){usedCache[k]=new Set()}}
  return usedCache[k];
}
function uniqueGenerated(person,type){
  const used=getUsed(person,type);
  let text='';
  for(let tries=0;tries<200;tries++){
    text=type==='comments'?makeComment(person):makeCaption(person);
    if(!used.has(text)) break;
  }
  used.add(text);
  if(used.size>5000){const arr=[...used].slice(-4000);used.clear();arr.forEach(x=>used.add(x));}
  try{localStorage.setItem(storageKey(person,type),JSON.stringify([...used]))}catch(e){}
  return text;
}
