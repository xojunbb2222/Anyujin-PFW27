function maybe(prob){return Math.random()<prob}
function softSwap(text,person){
  const swaps=person==='wonyoung'?[['really','honestly'],['so ','seriously '],['feels','looks'],['elegance','polish'],['current','modern'],['smart','good'],['exactly','really']]:[['really','honestly'],['so ','seriously '],['feels','looks'],['fresh','current'],['sporty','athletic'],['smart','good'],['exactly','really']];
  if(maybe(.38)){const s=pick(swaps); text=text.replace(s[0],s[1]);}
  return text;
}
function varyName(text,person){
  if(person==='wonyoung'){
    const opts=['Wonyoung','Jang Wonyoung','wonyoung'];
    text=text.replace(/Wonyoung/g,pick(opts));
  }else{
    const opts=['Yujin','An Yujin','yujin'];
    text=text.replace(/Yujin/g,pick(opts));
  }
  return text;
}
function addMicroTail(text,b,mode){
  if(!maybe(mode==='comments'?.35:.52)) return text;
  const tails=mode==='comments'?[...b.reactions,...b.parisBits,...b.brandChoice]:[...b.captionEnd,...b.reactions,...b.parisBits];
  const connectors=[' ',' — ','... ','\n',' and honestly, ',' / '];
  let tail=pick(tails);
  if(maybe(.55)) tail=tail.charAt(0).toLowerCase()+tail.slice(1);
  return text+pick(connectors)+tail;
}
function addEmoji(text,b,mode){
  if(!maybe(mode==='comments'?.68:.58)) return text;
  const e=pick(b.emoji); return e ? text+' '+e : text;
}
function humanize(text){
  text=text.replace(/\s+/g,' ').replace(/\s+([,.!?])/g,'$1').trim();
  if(maybe(.22)) text=text.replace(/\.$/,'');
  if(maybe(.18)) text=text.charAt(0).toLowerCase()+text.slice(1);
  if(maybe(.08)) text=text.replace(/!$/,'!!');
  if(maybe(.06)) text=text.replace(/\.$/,'...');
  return text;
}
const lastTheme={};
function chooseTheme(person,type){
  const keys=Object.keys(themeBanks[person]);
  const k=person+'_'+type;
  let t=pick(keys),tries=0;
  while(t===lastTheme[k] && tries++<8) t=pick(keys);
  lastTheme[k]=t;
  return t;
}
function themedComment(person){
  const b=phraseBanks[person], tb=themeBanks[person][chooseTheme(person,'comments')];
  let text=pick(tb.c);
  if(maybe(.46)) text += pick([' ',' — ','... ',' / ']) + pick(tb.ct);
  if(maybe(.13)) text += pick([' ',' — ','... ']) + pick(b.reactions);
  text=varyName(text,person);
  text=softSwap(text,person);
  return addEmoji(humanize(text),b,'comments');
}
function themedCaption(person){
  const b=phraseBanks[person], tb=themeBanks[person][chooseTheme(person,'captions')];
  let text=pick(tb.f);
  if(maybe(.78)) text += ' ' + pick(tb.s);
  if(maybe(.24)) text += pick([' ',' — ','... ','\n']) + pick(b.captionEnd);
  text=varyName(text,person);
  text=softSwap(text,person);
  if(maybe(.22)) text=text.replace(/\. /g,'.\n');
  return addEmoji(humanize(text),b,'captions');
}
function makeComment(person){
  if(maybe(.33)){
    const b=phraseBanks[person];
    let text=pick(naturalSeeds[person].comments);
    text=varyName(text,person); text=softSwap(text,person);
    if(maybe(.28)) text=addMicroTail(text,b,'comments');
    return addEmoji(humanize(text),b,'comments');
  }
  return themedComment(person);
}
function makeCaption(person){
  if(maybe(.30)){
    const b=phraseBanks[person];
    let text=pick(naturalSeeds[person].captions);
    text=varyName(text,person); text=softSwap(text,person);
    if(maybe(.42)) text=addMicroTail(text,b,'captions');
    if(maybe(.20)) text=text.replace(/\. /g,'.\n');
    return addEmoji(humanize(text),b,'captions');
  }
  return themedCaption(person);
}
const usedCache={};
function storageKey(person,type){return `pfw_used_${person}_${type}`}
function getUsed(person,type){
  const k=storageKey(person,type);
  if(!usedCache[k]){try{usedCache[k]=new Set(JSON.parse(localStorage.getItem(k)||'[]'))}catch(e){usedCache[k]=new Set()}}
  return usedCache[k];
}
function uniqueGenerated(person,type){
  const used=getUsed(person,type);
  let text='';
  for(let tries=0;tries<200;tries++){
    text=type==='comments'?makeComment(person):makeCaption(person);
    if(!used.has(text)) break;
  }
  used.add(text);
  if(used.size>5000){const arr=[...used].slice(-4000);used.clear();arr.forEach(x=>used.add(x));}
  try{localStorage.setItem(storageKey(person,type),JSON.stringify([...used]))}catch(e){}
  return text;
}

let type="comments"; const output=document.getElementById('output'), modeLabel=document.getElementById('modeLabel');
function randomize(){const raw=uniqueGenerated('yujin',type);output.textContent=type==='comments'?raw:raw+'\n\n'+tags;modeLabel.textContent=type==='comments'?'Yujin Comments':'Yujin Captions';}
document.querySelectorAll('.gen').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.gen').forEach(x=>x.classList.remove('active'));btn.classList.add('active');type=btn.dataset.type;randomize();}));

document.getElementById('copyBtn').addEventListener('click',async()=>{const text=output.textContent;try{await navigator.clipboard.writeText(text)}catch(e){const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}const toast=document.getElementById('toast');toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1000)});
document.getElementById('storyCopyBtn').addEventListener('click',async()=>{const text=document.getElementById('storyText').textContent;try{await navigator.clipboard.writeText(text)}catch(e){const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}const toast=document.getElementById('toast');toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1000)});

randomize();
</script>
